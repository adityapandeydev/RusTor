# Generate complete notices for the desktop dependency graph on all supported
# build targets. Preference order selects MIT where a crate offers MIT OR Apache.
accepted = [
  "MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
  "Unicode-3.0", "Unicode-DFS-2016", "BSL-1.0", "CC0-1.0",
  "Apache-2.0 WITH LLVM-exception", "MPL-2.0", "OpenSSL"
]
targets = [
  "x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin", "x86_64-apple-darwin"
]
ignore-dev-dependencies = true
ignore-build-dependencies = false
workarounds = ["ring", "rustls", "bitvec", "chrono", "cocoa", "gtk", "unicode-ident"]
