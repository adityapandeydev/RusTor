name: Desktop checks

on:
  pull_request:
    paths: &desktop-paths
      - 'apps/desktop/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain*'
      - '.cargo/**'
      - 'package.json'
      - 'bun.lock'
      - 'scripts/**'
      - 'about.toml'
      - 'deny.toml'
      - 'rustfmt.toml'
      - '.rustfmt.toml'
      - 'clippy.toml'
      - '.clippy.toml'
      - 'LICENSE'
      - 'README.md'
  push:
    branches: [main, 'feat/**', 'fix/**']
    # Workflow-only changes can be validated with the manual trigger.
    paths: *desktop-paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.3
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run test:packaging
      - run: bun audit
      - run: bun run build
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: bun run desktop:build --debug
