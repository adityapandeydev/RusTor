name: Desktop packages

on:
  pull_request:
    paths: &desktop-paths
      - 'apps/desktop/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain*'
      - '.cargo/**'
      - 'package.json'
      - 'bun.lock'
      - 'scripts/**'
      - 'about.toml'
      - 'deny.toml'
      - 'rustfmt.toml'
      - '.rustfmt.toml'
      - 'clippy.toml'
      - '.clippy.toml'
      - 'LICENSE'
      - 'README.md'
  push:
    branches: [main]
    # Workflow-only changes can be validated with the manual trigger.
    paths: *desktop-paths
  workflow_dispatch:
    inputs:
      updater:
        description: Build signed updater artifacts and a verified manifest (main only; no publication)
        type: boolean
        default: false
      notes:
        description: Release notes for the updater manifest
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Restrict updater credentials to main
        if: inputs.updater == true && github.ref != 'refs/heads/main'
        shell: bash
        run: |
          echo 'Signed updater builds must run from main.' >&2
          exit 1
      - name: Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: packages-${{ matrix.target }}
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run test:packaging
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Install release audit and notice tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-about --version 0.9.3 --features cli --locked
      - name: Build unsigned preview packages and checksums
        id: package
        if: inputs.updater != true
        env:
          NO_STRIP: 'true'
        run: bun run desktop:package --target ${{ matrix.target }}
      - name: Build and verify updater-signed packages
        id: updater
        if: github.event_name == 'workflow_dispatch' && inputs.updater == true && github.ref == 'refs/heads/main'
        env:
          NO_STRIP: 'true'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RUSTOR_UPDATER_PUBLIC_KEY: ${{ vars.RUSTOR_UPDATER_PUBLIC_KEY }}
        run: bun run desktop:package --target ${{ matrix.target }} --updater
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: RusTor-${{ matrix.target }}-${{ inputs.updater == true && 'updater' || 'unsigned' }}
          path: ${{ steps.updater.outputs.packages-dir || steps.package.outputs.packages-dir }}
          if-no-files-found: error
          retention-days: 14

  updater-manifest:
    name: Verify complete updater feed
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.updater == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: RusTor-*-updater
          path: updater-packages
      - name: Assemble only after every native artifact verifies
        env:
          RUSTOR_UPDATER_PUBLIC_KEY: ${{ vars.RUSTOR_UPDATER_PUBLIC_KEY }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          printf '%s' "$RELEASE_NOTES" > "$RUNNER_TEMP/updater-notes.txt"
          node scripts/updater-manifest.mjs --packages updater-packages --notes "$RUNNER_TEMP/updater-notes.txt" --output updater-feed/latest.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: RusTor-updater-manifest
          path: updater-feed/latest.json
          if-no-files-found: error
          retention-days: 14
