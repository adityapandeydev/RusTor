name: Website

on:
  pull_request:
    paths: ['web/**', 'package.json', 'bun.lock', '.github/workflows/pages.yml']
  push:
    branches: [main]
    paths: ['web/**', 'package.json', 'bun.lock', '.github/workflows/pages.yml']
  release:
    types: [published, edited, unpublished, deleted]
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.ref }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - name: Check website release behavior and React interactions
        run: bun run web:test
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6.0.0
      - name: Build static site with every public release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run web:build --out "$RUNNER_TEMP/rustor-site"
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ${{ runner.temp }}/rustor-site

  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'release')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5.0.1
      - uses: actions/checkout@v7.0.1
        if: github.event_name != 'schedule'
        with:
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.ref }}
          sparse-checkout: web
      - uses: actions/setup-node@v7.1.0
        if: github.event_name != 'schedule'
        with:
          node-version: '24'
      - name: Notify IndexNow after deployment
        if: github.event_name != 'schedule'
        continue-on-error: true
        run: node web/indexnow.mjs
