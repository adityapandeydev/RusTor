[workspace]
members = ["crates/rustor-torrent", "apps/desktop/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/adityapandeydev/RusTor"

[workspace.dependencies]
librqbit = { version = "=9.1.0", default-features = false, features = ["rust-tls"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net"] }
tempfile = "3"
url = "2"
