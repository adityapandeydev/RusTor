[workspace]
members = ["crates/rustor-torrent", "crates/rustor-search", "apps/desktop/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/adityapandeydev/RusTor"

[workspace.dependencies]
librqbit = { version = "=9.1.0", default-features = false, features = ["rust-tls"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net"] }
tempfile = "3"
url = "2"

# Upstream fix for RUSTSEC-2026-0293 until librqbit-utp publishes a fixed release.
[patch.crates-io]
librqbit-utp = { git = "https://github.com/ikatson/librqbit-utp", rev = "f119a999657d66fe2c2322613428241ce8a69f23" }
